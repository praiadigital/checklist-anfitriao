<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checklist do Anfitrião — temporada sem estresse | Praia Digital</title><meta name="description" content="Checklist interativo de preparação do imóvel para locação de temporada, com progresso salvo no navegador."><link rel="canonical" href="https://praia.digital/checklist-anfitriao/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:720px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}input[type=checkbox]{width:20px;height:20px;accent-color:#0ea5e9}.done span{text-decoration:line-through;color:#94a3b8}h3{margin:18px 0 6px;color:#0c4a6e}.prog{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:14px}.prog>div{height:100%;background:#16a34a;transition:width .4s}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>✅ Checklist do Anfitrião</h1><p>Prepare seu imóvel de temporada sem esquecer nada. Progresso salvo automaticamente.</p></header><main class="container"><div class="card"><div class="prog"><div id="bar" style="width:0%"></div></div><div id="list"></div></div><div class="card"><strong>Próximos passos:</strong><br>🤖 <a class="app" href="https://praia.digital/concierge-ia/">Concierge IA</a> — mensagens prontas para hóspedes<br>💸 <a class="app" href="https://praia.digital/preco-justo/">Preço Justo</a> — precifique certo<br>📈 <a class="app" href="https://praia.digital/simulador-roi/">Simulador ROI</a> — veja o rendimento</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>var itens={'📋 Anúncio':['Fotos profissionais (mín. 20)','Descrição otimizada nos portais','Preço dinâmico por temporada','Calendário sincronizado (Airbnb/Booking)'],'🧹 Preparo':['Limpeza profissional','Enxoval completo (2 jogos por cama)','Kit cozinha básico + temperos','Wi-Fi testado e senha visível','Itens de praia (cadeiras, guarda-sol)'],'🔐 Operação':['Fechadura/lockbox funcionando','Contato de emergência com hóspede','Manual da casa impresso','Vistoria com fotos a cada checkout'],'💰 Financeiro':['Conta separada para receitas','Taxa de limpeza definida','Contrato/termo de temporada','Reserva para manutenção (10%/mês)']};var st=JSON.parse(localStorage.getItem('checklist')||'{}');var list=document.getElementById('list');var html='';Object.keys(itens).forEach(function(cat){html+='<h3>'+cat+'</h3>';itens[cat].forEach(function(it){var k=cat+it;html+='<label class="'+(st[k]?'done':'')+'"><input type="checkbox" '+(st[k]?'checked':'')+' onchange="tgl(\''+k.replace(/'/g,'')+'\',this)"><span>'+it+'</span></label>';});});list.innerHTML=html;upd();function tgl(k,el){st[k]=el.checked;localStorage.setItem('checklist',JSON.stringify(st));el.parentElement.classList.toggle('done',el.checked);upd();}function upd(){var ks=Object.keys(st).filter(function(k){return st[k]});var total=0;Object.keys(itens).forEach(function(c){total+=itens[c].length});document.getElementById('bar').style.width=Math.round(ks.length/total*100)+'%';}</script></body></html>
